name: recruit-v4
services:
  postgres:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    container_name: recruit-v4-postgres
    labels:
      com.hzpc.recruit.v4: "true"
    env_file: private/postgres.env
    ports: ["127.0.0.1:55434:5432"]
    volumes: ["recruit-v4-pg:/var/lib/postgresql/data"]
    mem_limit: 512m
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "recruit_v4", "-d", "recruit_v4"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  recruit-v4-pg:
    external: true
